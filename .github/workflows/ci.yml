name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: omi_proto host unit tests (ASan/UBSan)
        run: make -C test/host test

  build-esp32s3:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build (esp32s3)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
          idf.py size
      - uses: actions/upload-artifact@v4
        with:
          name: omi-bridge-esp32s3
          path: |
            build/omi_bridge.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error
